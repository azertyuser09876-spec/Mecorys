<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mecorys</title>
<style>:root {
  --ink: #efe6d6;
  --ink-dim: #b8ab96;
  --panel: rgba(22, 20, 19, 0.86);
  --panel-edge: rgba(214, 190, 150, 0.28);
  --accent: #d8a35c;
  --good: #9fc28a;
  --bad: #d97a5e;
  --font: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
  --mono: ui-monospace, 'Cascadia Mono', Consolas, monospace;
}

html,
body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #0d0c0b;
  color: var(--ink);
  font-family: var(--font);
}

#screen {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  cursor: crosshair;
}

#ui {
  position: fixed;
  inset: 0;
  pointer-events: none;
}

.hidden {
  display: none !important;
}

/* --- HUD --- */
.hud {
  position: fixed;
  inset: 0;
  pointer-events: none;
}
.hud-res {
  position: absolute;
  left: 14px;
  top: 12px;
  display: flex;
  gap: 12px;
  font-family: var(--mono);
  font-size: 14px;
  text-shadow: 0 1px 2px #000;
  transition: opacity 1.2s ease;
}
.hud-res.dim {
  opacity: 0.38;
}
.hud-res .res {
  display: flex;
  align-items: center;
  gap: 4px;
}
.hud-res canvas {
  width: 14px;
  height: 14px;
}
.banner {
  position: absolute;
  left: 0;
  right: 0;
  top: 18%;
  text-align: center;
  opacity: 0;
  text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
}
.banner.show {
  animation: banner 6s ease forwards;
}
.b-title {
  font-size: clamp(26px, 3.6vw, 48px);
  letter-spacing: 0.08em;
  font-variant: small-caps;
}
.b-sub {
  margin-top: 6px;
  font-style: italic;
  color: var(--ink-dim);
  font-size: clamp(14px, 1.4vw, 19px);
}
@keyframes banner {
  0% { opacity: 0; transform: translateY(8px); }
  15% { opacity: 1; transform: none; }
  75% { opacity: 1; }
  100% { opacity: 0; }
}
.toasts {
  position: absolute;
  left: 16px;
  bottom: 18px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-width: min(520px, 80vw);
}
.toast {
  background: var(--panel);
  border-left: 3px solid var(--accent);
  padding: 7px 12px;
  font-size: 15px;
  border-radius: 2px;
}
.toast.good {
  border-left-color: var(--good);
}
.toast.bad {
  border-left-color: var(--bad);
}
.toast.lore {
  border-left-color: #a99be0;
  font-style: italic;
}
.hint {
  position: absolute;
  right: 16px;
  bottom: 18px;
  max-width: min(380px, 60vw);
  text-align: right;
  font-size: 14px;
  color: var(--ink-dim);
  opacity: 0;
  transition: opacity 0.6s;
  text-shadow: 0 1px 3px #000;
}
.hint.show {
  opacity: 1;
}
.status {
  position: absolute;
  right: 16px;
  top: 12px;
  text-align: right;
  font-size: 13px;
  font-family: var(--mono);
  color: var(--ink-dim);
  text-shadow: 0 1px 2px #000;
}
kbd {
  display: inline-block;
  min-width: 1.2em;
  padding: 0 5px;
  border: 1px solid rgba(239, 230, 214, 0.5);
  border-bottom-width: 2px;
  border-radius: 3px;
  font-family: var(--mono);
  font-size: 0.85em;
  text-align: center;
  background: rgba(0, 0, 0, 0.35);
  margin-right: 4px;
}
.prompt {
  position: fixed;
  transform: translate(-50%, -100%);
  background: var(--panel);
  border: 1px solid var(--panel-edge);
  padding: 5px 10px;
  font-size: 14px;
  white-space: nowrap;
  border-radius: 3px;
  pointer-events: none;
}
.prompt .cost {
  color: var(--ink-dim);
  font-size: 12px;
  margin-left: 6px;
}
.prompt .cost.bad {
  color: var(--bad);
}

/* --- Panneaux --- */
.panel-wrap {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(8, 7, 6, 0.45);
  pointer-events: auto;
}
.panel {
  background: rgba(24, 22, 20, 0.96);
  border: 1px solid var(--panel-edge);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
  width: min(980px, 94vw);
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  border-radius: 4px;
}
.panel.wide {
  width: min(1200px, 96vw);
}
.panel.narrow {
  width: min(560px, 94vw);
}
.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 18px;
  border-bottom: 1px solid var(--panel-edge);
}
.panel-head h2 {
  margin: 0;
  font-size: 22px;
  font-weight: normal;
  letter-spacing: 0.04em;
  font-variant: small-caps;
}
.panel-close {
  background: none;
  border: none;
  color: var(--ink-dim);
  font-size: 28px;
  cursor: pointer;
  line-height: 1;
}
.panel-close:hover {
  color: var(--ink);
}
.panel-body {
  padding: 16px 18px 18px;
  overflow: auto;
}
.panel p {
  line-height: 1.5;
}
.muted {
  color: var(--ink-dim);
}
.row {
  display: flex;
  gap: 16px;
}
.col {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.grow {
  flex: 1;
}
button.btn {
  font-family: var(--font);
  font-size: 15px;
  background: #3a332c;
  color: var(--ink);
  border: 1px solid rgba(214, 190, 150, 0.35);
  padding: 7px 14px;
  border-radius: 3px;
  cursor: pointer;
}
button.btn:hover:not(:disabled) {
  background: #4a4036;
}
button.btn.primary {
  background: #6a4a2a;
  border-color: var(--accent);
}
button.btn.primary:hover:not(:disabled) {
  background: #7d5832;
}
button.btn:disabled {
  opacity: 0.45;
  cursor: default;
}
button.btn.small {
  font-size: 13px;
  padding: 4px 9px;
}
.tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.tab {
  background: none;
  border: 1px solid transparent;
  color: var(--ink-dim);
  font-family: var(--font);
  font-size: 15px;
  padding: 5px 12px;
  cursor: pointer;
  border-radius: 3px;
}
.tab.on {
  color: var(--ink);
  border-color: var(--panel-edge);
  background: rgba(255, 255, 255, 0.04);
}
.card {
  border: 1px solid rgba(214, 190, 150, 0.18);
  background: rgba(255, 255, 255, 0.025);
  padding: 10px 12px;
  border-radius: 3px;
}
.card h3 {
  margin: 0 0 6px;
  font-weight: normal;
  font-size: 17px;
}
.list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 8px;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--mono);
  font-size: 12px;
  padding: 2px 6px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.06);
  margin: 2px 4px 2px 0;
}
.chip.bad {
  color: var(--bad);
}
.chip.good {
  color: var(--good);
}
.meter {
  height: 6px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 3px;
  overflow: hidden;
}
.meter > div {
  height: 100%;
  background: var(--accent);
}
.ok {
  color: var(--good);
}
.ko {
  color: var(--bad);
}

/* --- Dialogues --- */
.dialog {
  position: fixed;
  left: 50%;
  bottom: 6vh;
  transform: translateX(-50%);
  width: min(760px, 92vw);
  background: var(--panel);
  border: 1px solid var(--panel-edge);
  padding: 14px 20px 16px;
  border-radius: 4px;
  pointer-events: auto;
}
.d-who {
  color: var(--accent);
  font-variant: small-caps;
  letter-spacing: 0.06em;
  margin-bottom: 6px;
  font-size: 16px;
}
.d-text {
  font-size: 18px;
  line-height: 1.5;
  min-height: 2.8em;
}
.d-next {
  text-align: right;
  color: var(--ink-dim);
  animation: blink 1.2s infinite;
}
.d-choices {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 10px;
}
.d-choice {
  text-align: left;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(214, 190, 150, 0.25);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  padding: 7px 12px;
  border-radius: 3px;
  cursor: pointer;
}
.d-choice:hover {
  background: rgba(216, 163, 92, 0.15);
}
@keyframes blink {
  50% { opacity: 0.3; }
}

/* --- Cinématiques --- */
.cine-bar {
  position: fixed;
  left: 0;
  right: 0;
  height: 0;
  background: #000;
  transition: height 1.2s ease;
  pointer-events: none;
}
.cine-bar.top {
  top: 0;
}
.cine-bar.bottom {
  bottom: 0;
}
.cine-bar.on {
  height: 11vh;
}
.caption {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 13vh;
  text-align: center;
  font-size: clamp(16px, 1.7vw, 22px);
  font-style: italic;
  opacity: 0;
  text-shadow: 0 2px 8px #000;
  padding: 0 10vw;
  pointer-events: none;
}
.caption.big {
  bottom: auto;
  top: 40%;
  font-size: clamp(28px, 4vw, 56px);
  font-style: normal;
  letter-spacing: 0.08em;
  font-variant: small-caps;
}
.caption.show {
  animation: cap 0.8s ease forwards;
}
@keyframes cap {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}
.fade {
  position: fixed;
  inset: 0;
  background: #000;
  opacity: 0;
  pointer-events: none;
}

/* --- Mode construction --- */
.buildbar {
  position: fixed;
  left: 50%;
  bottom: 14px;
  transform: translateX(-50%);
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px;
  max-width: 96vw;
  pointer-events: auto;
  background: rgba(18, 16, 15, 0.82);
  border: 1px solid var(--panel-edge);
  padding: 8px 10px 6px;
  border-radius: 4px;
}
.bitem {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  min-width: 92px;
  padding: 5px 8px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(214, 190, 150, 0.2);
  color: var(--ink);
  font-family: var(--font);
  cursor: pointer;
  border-radius: 3px;
  position: relative;
}
.bitem.on {
  border-color: var(--accent);
  background: rgba(216, 163, 92, 0.16);
}
.bitem.poor .bcost {
  color: var(--bad);
}
.bnum {
  position: absolute;
  right: 5px;
  top: 3px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-dim);
}
.bname {
  font-size: 14px;
}
.bcost {
  font-size: 11px;
  color: var(--ink-dim);
  font-family: var(--mono);
}
.bhelp {
  width: 100%;
  text-align: center;
  font-size: 12px;
  color: var(--ink-dim);
  margin-top: 2px;
}

/* --- Éditeur de robots --- */
.d-top {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.d-name,
.r-name {
  font-family: var(--font);
  font-size: 16px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--panel-edge);
  color: var(--ink);
  padding: 4px 8px;
  border-radius: 3px;
  width: 200px;
}
.r-name {
  width: 150px;
  font-size: 15px;
}
.d-select {
  font-family: var(--font);
  font-size: 14px;
  background: #2a2622;
  color: var(--ink);
  border: 1px solid var(--panel-edge);
  padding: 4px;
  border-radius: 3px;
}
.d-plans {
  display: flex;
  gap: 6px;
}
.d-main {
  display: flex;
  gap: 14px;
  align-items: flex-start;
}
.d-palette {
  width: 190px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  max-height: 62vh;
  overflow: auto;
}
.d-cat {
  font-size: 12px;
  color: var(--ink-dim);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-top: 6px;
}
.d-mod {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid transparent;
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  padding: 2px 6px;
  cursor: pointer;
  border-radius: 3px;
  text-align: left;
}
.d-mod.on {
  border-color: var(--accent);
  background: rgba(216, 163, 92, 0.15);
}
.d-mod.locked {
  opacity: 0.35;
  cursor: default;
}
.d-center {
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
}
.d-grid {
  border: 1px solid var(--panel-edge);
  cursor: crosshair;
  max-width: 100%;
}
.d-test {
  border: 1px solid rgba(214, 190, 150, 0.15);
  width: 300px;
  height: 90px;
  image-rendering: pixelated;
}
.d-help {
  font-size: 12px;
}
.d-side {
  flex: 1;
  min-width: 240px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.d-side h3 {
  margin: 10px 0 4px;
  font-weight: normal;
  font-size: 16px;
  font-variant: small-caps;
  color: var(--accent);
}
.d-side h3:first-child {
  margin-top: 0;
}
.d-stat {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
  border-bottom: 1px dotted rgba(214, 190, 150, 0.12);
  padding: 2px 0;
}
.d-issues {
  margin-top: 8px;
  font-size: 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.warn {
  color: #e0c070;
}
.small {
  font-size: 12px;
}
.d-btns {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}
.r-card {
  margin-bottom: 8px;
}
.r-card.focus {
  border-color: var(--accent);
}
.r-orders {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 8px;
}

/* --- Titre et création --- */
.title {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  padding-left: 8vw;
  background: linear-gradient(90deg, rgba(10, 9, 8, 0.75), rgba(10, 9, 8, 0.1) 60%);
  pointer-events: auto;
  animation: fadein 2.5s ease;
}
@keyframes fadein {
  from { opacity: 0; }
  to { opacity: 1; }
}
.title-card h1 {
  font-size: clamp(54px, 9vw, 124px);
  font-weight: normal;
  letter-spacing: 0.18em;
  margin: 0;
  font-variant: small-caps;
  text-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
}
.title-sub {
  font-style: italic;
  color: var(--ink-dim);
  font-size: clamp(16px, 1.8vw, 22px);
  margin: 6px 0 34px 4px;
}
.title-btns {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: min(320px, 70vw);
}
button.btn.big {
  font-size: 19px;
  padding: 11px 18px;
  text-align: left;
}
.title-foot {
  margin-top: 40px;
  max-width: 420px;
}
.creation {
  align-items: center;
  margin: 10px 0;
}
.creation-preview {
  width: 160px;
  height: 200px;
  border: 1px solid var(--panel-edge);
  image-rendering: pixelated;
  flex-shrink: 0;
}
.creation-controls {
  display: flex;
  flex-direction: column;
  gap: 5px;
  flex: 1;
}
.c-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.c-row > .muted:first-child {
  width: 130px;
  font-size: 14px;
}
.c-val {
  min-width: 140px;
  text-align: center;
  font-size: 14px;
}
.swatch {
  display: inline-block;
  width: 140px;
  height: 16px;
  border-radius: 2px;
  border: 1px solid rgba(255, 255, 255, 0.2);
}
.c-row input[type='range'] {
  flex: 1;
}
.goal {
  border-color: var(--accent);
  margin-bottom: 10px;
}
.map {
  display: block;
  max-width: 100%;
  cursor: grab;
  border: 1px solid rgba(214, 190, 150, 0.15);
}
.help p {
  margin: 8px 0;
}
</style>
</head>
